[project]
name = "valorant-pricing-model"
version = "0.1.0"
description = "Live pricing engine for Valorant BO3 series + per-map Kalshi markets"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "jxc2008", email = "jxc2008@nyu.edu" },
]
dependencies = [
    "aiohttp>=3.13,<4",
    "cryptography>=42,<46",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "Pillow>=10.4,<12",
    "pytesseract>=0.3.13,<1",
    "python-dotenv>=1",
    "requests>=2.32",
    "requests-cache>=1.3,<2",
    "tenacity>=8.5",
    "tqdm>=4.66",
    "tweepy>=4.14,<5",
    "websockets>=12,<14",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.6",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "reference/",
    "models/",
    "logs/",
    ".venv/",
]

[tool.ruff.lint]
# Conservative starter set; tighten in later phases.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]  # test fn / param names may be Pascal-ish
"scripts/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
# Broad scope so the Phase 5 80% gate (CON-coverage-target) measures the
# whole package, not just the math layer. Phase 0 ships tests against
# src/main.py and src/config/constants.py; both must be counted.
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 0  # Phase 0 has no tests; coverage gate is enforced in Phase 5 (CON-coverage-target = 80%).
show_missing = true
skip_covered = false

[tool.mypy]
# Default: gradual typing for non-pricing layers per CONVENTIONS.md.
python_version = "3.11"
files = ["src", "tests"]
# No `exclude = [...]` here: `files` already pins the scope to src/ and
# tests/, neither of which contains reference/, models/, logs/, or
# scripts/. Adding excludes for those paths would be dead config.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CON-mypy-strict-pricing: the math layer must type-check fully.
module = "src.pricing.*"
strict = true
disallow_any_explicit = false  # allow Any in narrow places if explicitly written
warn_return_any = true

[[tool.mypy.overrides]]
# Phase 3 SPEC §"Constraints" (CRule 11): mypy --strict extends from src/pricing/
# to ALSO cover src/state/. RESEARCH Pitfall 7 — must add the override here
# explicitly so CI runs strict, not just CLI invocations.
module = "src.state.*"
strict = true
disallow_any_explicit = false
warn_return_any = true

[[tool.mypy.overrides]]
# Phase 04 SPEC §"Carry-forward" / RESEARCH §"User Constraints" — extend mypy --strict
# from src/pricing/ + src/state/ to ALSO cover src/quoting/ (math + risk-control layer).
module = "src.quoting.*"
strict = true
disallow_any_explicit = false
warn_return_any = true

[[tool.mypy.overrides]]
# Phase 04 SPEC §"Carry-forward" — strict on src/sizing/ (pure-function Kelly sizer).
module = "src.sizing.*"
strict = true
disallow_any_explicit = false
warn_return_any = true
